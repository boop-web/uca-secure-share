services:
  uca-share:
    image: uca-secure-share:latest
    restart: unless-stopped
    ports:
      # Bound to localhost: put a reverse proxy (nginx, Caddy) in front.
      # Its body size limit must be above share.chunkSize (default 10 MB).
      - 127.0.0.1:3000:3000
    environment:
      - TRUST_PROXY=true # set to false if nothing proxies in front of the container
    volumes:
      - "./data:/opt/app/backend/data"
      - "./data/images:/opt/app/frontend/public/img"
  #      - "./config.yaml:/opt/app/config.yaml" # Add this line, if you want to configure the app via config file and not via UI

  # To add ClamAV, to scan your shares for malicious files,
  # see https://stonith404.github.io/pingvin-share/setup/integrations/#clamav-docker-only
